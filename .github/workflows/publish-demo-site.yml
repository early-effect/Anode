name: Publish Demo Site

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install root npm deps
        run: npm ci
      - name: Install demo npm deps
        run: npm ci
        working-directory: demo-app
      - name: Link Scala.js (demo)
        run: sbt demo/fullLinkJS
      - name: Vite production build
        run: npm run build
        working-directory: demo-app
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo-app/dist
          cname: www.earlyeffect.rocks
